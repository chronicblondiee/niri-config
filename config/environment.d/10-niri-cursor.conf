# Cursor theme lookup path — works around a bug in the `xcursor` crate niri
# uses (v0.3.10): when $XDG_DATA_HOME is set, the crate searches that path
# directly instead of appending "icons/", so themes in ~/.local/share/icons/
# are never found. XCURSOR_PATH is checked first, bypassing that logic.
#
# This lives in environment.d (read by the systemd user manager, which starts
# niri.service) rather than in a session wrapper script installed over
# /usr/share/wayland-sessions/niri.desktop — that file is owned by the niri
# package and is not marked %config, so a niri update silently reverts it and
# takes the cursor fix with it.
XCURSOR_PATH=__HOME__/.local/share/icons:__HOME__/.icons:/usr/share/icons:/usr/share/pixmaps
